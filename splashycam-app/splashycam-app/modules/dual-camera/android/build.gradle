plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dualcamera'
version = '0.1.0'

android {
  namespace "expo.modules.dualcamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // MUST match the CameraX version expo-camera uses (node_modules/expo-camera/android/
  // build.gradle, `camerax_version`, 1.6.0 in SDK 57). Re-check after every Expo SDK upgrade.
  def camerax = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax}"
  implementation "androidx.camera:camera-camera2:${camerax}"
  implementation "androidx.camera:camera-lifecycle:${camerax}"
  implementation "androidx.camera:camera-video:${camerax}"
  implementation "androidx.camera:camera-view:${camerax}"
}
